# Used when building external pull requests
# We don't want to publish build artifacts or expose our other caches to possibly untrusted code
name: build-pull-request

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Extract current branch name
      shell: bash
        # bash pattern expansion to grab branch name without slashes
      run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> 
        $GITHUB_OUTPUT
      id: ref

    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
          # Temurin has no JDK 25 build for Windows on ARM64; the Microsoft Build of OpenJDK does
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        java-version: 25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true

    - name: Execute Gradle build
      run: ./gradlew build

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sodium-artifacts-${{ steps.ref.outputs.branch }}
        path: build/mods/*.jar
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
